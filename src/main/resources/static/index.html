<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinyFarm</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6.26.0/babel.min.js"></script>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [user, setUser] = React.useState(null);
            const [ferme, setFerme] = React.useState(null);

            // Vérifie l'état de connexion
            async function checkLoginStatus() {
                try {
                    const userRes = await fetch('/user', { credentials: "include" });
                    if (userRes.ok) {
                        const userData = await userRes.json();
                        setUser(userData);

                        // Récupère les données de la ferme
                        fetchFerme();
                    } else {
                        setUser(null);
                        setFerme(null);
                    }
                } catch (err) {
                    console.error("Erreur lors de la vérification de l'utilisateur :", err);
                }
            }

            // Récupère les données de la ferme
            async function fetchFerme() {
                try {
                    const fermeRes = await fetch('/ferme', { credentials: "include" });
                    if (fermeRes.ok) {
                        const fermeData = await fermeRes.json();
                        setFerme(fermeData);
                    } else {
                        setFerme(null);
                    }
                } catch (err) {
                    console.error("Erreur lors de la récupération de la ferme :", err);
                }
            }

            // Gère la connexion
            function login() {
                window.location.href = window.location.origin + '/oauth2/authorization/github';
            }

            // Gère la déconnexion
            async function logout() {
                try {
                    const res = await fetch('/logout', { method: "POST", credentials: "include", redirect: "manual" });
                    if (res.ok || res.status === 0) {
                        setUser(null);
                        setFerme(null);
                        window.location.href = "/";
                    }
                } catch (err) {
                    console.error("Erreur lors de la déconnexion :", err);
                }
            }

            React.useEffect(() => {
                checkLoginStatus();
            }, []);

            return (
                <div className="app">
                    <header>
                        <h1>Bienvenue sur TinyFarm</h1>
                        {user ? (
                            <div>
                                <p>Connecté en tant que : {user.username}</p>
                                <button onClick={logout}>Se déconnecter</button>
                            </div>
                        ) : (
                            <button onClick={login}>Se connecter avec GitHub</button>
                        )}
                    </header>

                    {ferme ? (
                        <div>
                            <h2>Votre Ferme</h2>
                            <p>Nom : {ferme.nom}</p>
                            <p>Niveau : {ferme.niveau}</p>
                            <p>Ressources : {ferme.ressources}</p>
                        </div>
                    ) : (
                        <p>{user ? "Chargement de la ferme..." : "Veuillez vous connecter pour voir votre ferme."}</p>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>

</html>
