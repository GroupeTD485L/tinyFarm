<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TinyFarm - Connexion</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6.26.0/babel.min.js"></script>
    <link rel="stylesheet" href="/base.css" />
    <link rel="stylesheet" href="/reset.css" />
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [user, setUser] = React.useState(null);
            const [ferme, setFerme] = React.useState(null);
            const [vache, setVache ] = React.useState(null);
            const [classement, setClassement] = React.useState([]);
            const [error, setError] = React.useState(null);

            // Vérifie l'état de connexion
            async function checkLoginStatus() {
                try {
                    setError(null);
                    fetchClassement();
                    const userRes = await fetch('/user', { credentials: "include" });
                    if (userRes.ok) {
                        const userData = await userRes.json();
                        setUser(userData);

                        // Récupère les données de la ferme
                        fetchFerme();
                        document.title = 'Tinyfarm - Bienvenue !'
                    } else {
                        setUser(null);
                        setFerme(null);
                    }
                } catch (err) {
                    console.error("Erreur lors de la vérification de l'utilisateur :", err);
                }
            }

            async function fetchClassement() {
                const classementRes = await fetch('/classement?page=0&size=5', { credentials: "include" });
                try {
                    const classementData = await classementRes.json();
                    setClassement(classementData.content);
                } catch (err) {
                    setError("Erreur lors de la récupération du classement");
                    console.log("Erreur lors de la récupération du classement :", err);
                }
            }

            // Récupère les données de la ferme
            async function fetchFerme() {
                try {
                    const fermeRes = await fetch('/ferme/', { credentials: "include" });
                    if (fermeRes.ok) {
                        const fermeData = await fermeRes.json();
                        console.log(fermeData)
                        setFerme(fermeData);
                        setVache(fermeData.vache);
                    } else {
                        setFerme(null);
                    }
                } catch (err) {
                    console.error("Erreur lors de la récupération de la ferme :", err);
                }
            }


            // Gère la connexion
            function login() {
                window.location.href = window.location.origin + '/oauth2/authorization/github';
            }

            // Gère la déconnexion
            async function logout() {
                try {
                    const res = await fetch('/logout', { method: "POST", credentials: "include", redirect: "manual" });
                    if (res.ok || res.status === 0) {
                        setUser(null);
                        setFerme(null);
                        window.location.href = "/";
                    }
                } catch (err) {
                    console.error("Erreur lors de la déconnexion :", err);
                }
            }

            async function nourrirVache(){
                try {
                    const response = await fetch('/vache/nourrir', {
                    method: 'PUT',
                    body: JSON.stringify("Botte de foin")
                    });
                    if (response.ok) {
                        const vache = await response.json();
                        setVache(vache);
                        console.log(vache)
                        setError(null);
                    } else if (response.status === 403) {
                        const errorData = await response.text();
                        setError(errorData || "Erreur 403");
                    } else {
                        setError("Une erreur innatendue s'est produite")
                    }
                } catch (err) {
                    console.error("Erreur lors du nourissage de la vache : ", err);
                }
            }

            async function soignerVache(){
                try {
                    const response = await fetch('/vache/soigner', { method: 'PUT' });
                    if (response.ok) {
                        const vache = await response.json();
                        setVache(vache);
                        console.log(vache)
                        setError(null);
                    } else if (response.status === 403) {
                        const errorData = await response.text();
                        setError(errorData || "Erreur 403");
                    } else {
                        setError("Une erreur innatendue s'est produite");
                    }
                } catch (err) {
                    console.error("Erreur lors du soin de la vache : ", err);
                }
            }

            async function abreuverVache() {
                try {
                    const response = await fetch('/vache/abreuver', { method: 'PUT' });
                    if (response.ok) {
                        const vache = await response.json();
                        setVache(vache);
                        console.log(vache);
                        setError(null);
                    } else if (response.status === 403) {
                        const errorData = await response.text();
                        console.log(errorData);
                        setError(errorData || "Erreur 403");
                    } else {
                        setError("Une erreur inattendue s'est produite.");
                    }
                } catch (err) {
                    console.error("Erreur lors de l'abreuvage de la vache : ", err);
                    setError("Une erreur s'est produite lors de l'abreuvage de la vache.");
                }
            }

            async function laverVache(){
                try {
                    const response = await fetch('/vache/laver', { method: 'PUT' });
                    if (response.ok) {
                        const vache = await response.json();
                        setVache(vache);
                        console.log(vache)

                    } else if (response.status === 403) {
                        const errorData = await response.text();
                        setError(errorData || "Erreur 403");
                    } else {
                        setError("Une erreur innatendue s'est produite");
                    }
                } catch (err) {
                    console.error("Erreur lors du lavage de la vache : ", err);
                }
            }

            React.useEffect(() => {
                checkLoginStatus();
            }, []);

            return (
                <div className="app">
                    {error && (
                        <div class="error-message">
                            <p style={{ color: 'red' }}>Erreur : {error}</p>
                        </div>
                    )}

                    {user ? (
                        <div>
                            <p>Connecté en tant que : {user.username}</p>
                            <button onClick={logout}>Se déconnecter</button>
                        </div>
                    ) : (
                        <div class="login-screen">
                            <div class="classement">
                                <div class="classement-content">
                                    <p>Top des joueurs</p>
                                    <ol>
                                        {classement.length > 0 ? (
                                            classement.map((item, index) => (
                                                <li key={item.idClassement}>
                                                    <span>{item.nomFerme}</span>
                                                    <span class="score">Score : {item.score}</span>
                                                </li>
                                            ))
                                        ) : (
                                            <p>Aucun joueur n'existe pour le moment !</p>
                                        )}
                                    </ol>
                                </div>
                            </div>
                            <div class="login-screen-content">
                                <img src="/res/logo_40p.png" />
                                <h1>Rejoignez l'aventure agricole !</h1>
                                <button onClick={login}>Se connecter avec GitHub</button>
                            </div>
                        </div>
                    )}

                    {ferme ? (
                        <div className="ferme-section">
                            <h2>Votre Ferme</h2>
                            <p>Nom : {ferme.nom}</p>
                            <p>Votre solde : {ferme.ecus}</p>
                            
                            {vache ? (
                            <div className="vache-section">
                                <h2>Votre Vache</h2>
                                <p>Âge : {vache.age}</p>
                                <p>Poids : {vache.poids}</p>
                                {vache.maladeDepuis ? (
                                    <p>La vache est malade depuis : {vache.maladeDepuis}</p>
                                ) : (
                                    <p>La vache n'est pas malade</p>
                                )}
                                <p>Dernier breuvage : {vache.dernierBreuvage}</p>
                                <p>Dernier lavage : {vache.dernierLavage}</p>
                                <p>Dernier repas : {vache.dernierRepas}</p>
                                <p>Quantité de lait : {vache.qt_lait}</p>
                                <button onClick={nourrirVache}>Nourrir la vache</button>
                                <button onClick={abreuverVache}>Abreuver la vache</button>
                                <button onClick={soignerVache}>Soigner la vache</button>
                                <button onClick={laverVache}>Laver la vache</button>
                                <a href="/clapier.html"><button>Aller vers le clapier</button></a>
                            </div>
                            ) : (
                            <p>Vache morte</p>
                            )}
                        </div>
                    ) : (
                        <p>{user ? "Chargement de la ferme..." : ""}</p>
                    )}
                     
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>

</html>
